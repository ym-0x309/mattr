<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-labelledby="title desc">
  <title id="title">Topolyx (단색)</title>
  <desc id="desc">단색 버전의 Topolyx 로고 아이콘, currentColor로 색상 상속</desc>

  <polygon points="95,180 150,45 200,130"
           fill="none" stroke="currentColor" stroke-width="9"
           stroke-linejoin="round" stroke-linecap="round" opacity="0.4"/>
  <circle cx="95"  cy="180" r="7" fill="currentColor" opacity="0.5"/>
  <circle cx="150" cy="45"  r="7" fill="currentColor" opacity="0.5"/>
  <circle cx="200" cy="130" r="7" fill="currentColor" opacity="0.5"/>

  <polygon points="70,175 125,55 180,150"
           fill="none" stroke="currentColor" stroke-width="9"
           stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="70"  cy="175" r="8" fill="currentColor"/>
  <circle cx="125" cy="55"  r="8" fill="currentColor"/>
  <circle cx="180" cy="150" r="8" fill="currentColor"/>
</svg>
